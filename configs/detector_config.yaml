path:
  stage_one_path:  "/root/rm/radar-detect/weight/stage_one.pt" 
  stage_two_path: "/root/rm/radar-detect/weight/stage_two.pt" 
  stage_three_path: "/root/rm/radar-detect/weight/stage_three.pt"
  tracker_path: "/root/rm/radar-detect/configs/bytetrack.yaml"
params:
  labels: ["B1", "B2", "B3", "B4", "B5", "B7", "R1", "R2", "R3", "R4", "R5", "R7"]
  stage_one_conf: 0.1
  stage_two_conf: 0.6
  stage_three_conf: 0.5
  life_time: 90 # 生命周期

is_record: False
record_fps: 30

ros:
  detect_topic: "/vision/detect"
  result_topic: "/vision/result"
  frame_id: "vision_camera"
  process_hz: 100
  detect_publish_hz: 100
  alignment_cache_size: 8
  timestamp_tolerance_sec: 0.002
  display_enabled: True
  display_width: 1920
  display_height: 1080
