global:
  my_color: "Blue" # "Blue"
  is_debug: True # False


ctrl:
  MODE: 'video'  # 'camera'

car:
  life_span: 20 # 20帧若未刷新则认为不可信
  field_filter:
    enabled: true
    q_std: 2.0 # 参考 RM2025 KalmanFilter2d，过程噪声标准差，越大越跟随测量
    r_std: 1.0 # 参考 RM2025 KalmanFilter2d，测量噪声标准差，越大越平滑
    dt: 0.1 # 默认预测周期，实际运行时会用两次更新之间的真实dt覆盖
    outlier_threshold: 1.5 # 参考 RM2025 OUTLIER_THRESHOLD，单位m，超过则拒绝本次测量

lidar:
  height_threshold: 5.5 # 还没有量，激光雷达如果点比负1.4小，则认为在地面，不要
  min_distance: 1 # 去除距离在这个范围以内的接收点云
  max_distance: 40 # 去除距离在这个范围以外的接收点云
  lidar_topic_name: "/centroid_points" # 点云发布话题名字

communication:
  enabled: false # 调试时没有下位机串口可改为 false
  send_transport: 'serial' # Messager 发送端保持串口；Receiver->Messager 状态同步使用 ROS
  position_topic: '/messge/position'
  receiver_state_topic: '/receiver/state'
  guess_topic: '/guess/point'
  drone_fixed_y: 1.866667 # 无人机小地图固定发送的 y 坐标，现场填写
  port: '/dev/ttyUSB0' # 串口
  bps: 115200 # 波特率
  timex: 0.01 # 超时时间

messager:
  enabled: true
  state_topic: '/messager/state'
  main_loop_hz: 100.0
  map_hz: 4.9
  sentry_hz: 5.0
  enemy_hp_hz: 4.9
  double_effect_hz: 25.0

others:
  is_vs_qd: False # 打青岛大学特殊版本
  is_vs_hg: False # 打合肥工业大学特殊版本
